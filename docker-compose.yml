services:
  dmark-hole:
    build: .
    image: dmark-hole:latest
    container_name: dmark-hole
    restart: unless-stopped
    init: true
    ports:
      # Web UI + API
      - "8080:8080"
      # Built-in SMTP receiver for rua/ruf reports. Only needed when
      # SMTP_ENABLED=true (or enabled from the UI). The container listens on
      # 2525 (unprivileged); to receive real mail map it to host port 25:
      #   - "25:2525"
      - "2525:2525"
    volumes:
      # SQLite database + auto-generated secret live here. Back this up.
      - dmark-data:/data
    environment:
      LOG_LEVEL: info
      # Set to true when serving over HTTPS (behind a reverse proxy).
      SECURE_COOKIES: "false"
      # Set to true when behind a reverse proxy (X-Forwarded-* headers).
      TRUST_PROXY: "false"
      # Built-in SMTP receiver (can also be toggled in the UI).
      SMTP_ENABLED: "false"
      # Optional: fixed secret (>= 32 chars). If unset, one is generated in /data.
      # SECRET_KEY: "change-me-to-a-random-string-of-at-least-32-chars"
      # Optional: bootstrap admin. If unset, use the first-run setup page.
      # ADMIN_EMAIL: "admin@example.com"
      # ADMIN_PASSWORD: "change-me"

    # --- Optional: Traefik labels for HTTPS (uncomment and adapt) -----------
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.dmark.rule=Host(`dmarc.example.com`)
    #   - traefik.http.routers.dmark.tls.certresolver=letsencrypt
    #   - traefik.http.services.dmark.loadbalancer.server.port=8080
    # With Caddy instead: `dmarc.example.com { reverse_proxy dmark-hole:8080 }`
    # Remember TRUST_PROXY=true and SECURE_COOKIES=true when doing so.

volumes:
  dmark-data:
